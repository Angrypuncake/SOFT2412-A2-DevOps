plugins {
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
  id 'jacoco'
}

group 'org.example'
version '1.0-SNAPSHOT'



repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.10.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainClass = 'javafx.MainApp'
}

javafx {
  version = '17.0.6'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  // JavaFX Modules
  implementation "org.openjfx:javafx-controls:17.0.2"
  implementation "org.openjfx:javafx-fxml:17.0.2"

  // Incase we wanna work with postgresql
  implementation "org.postgresql:postgresql:42.2.20"
  implementation 'org.xerial:sqlite-jdbc:3.36.0.3'

  implementation('org.controlsfx:controlsfx:11.1.2')
  implementation('com.dlsc.formsfx:formsfx-core:11.6.0') {
    exclude(group: 'org.openjfx')
  }
  implementation('net.synedra:validatorfx:0.4.0') {
    exclude(group: 'org.openjfx')
  }
  implementation('org.kordamp.ikonli:ikonli-javafx:12.3.1')
  implementation('org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0')

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

  testImplementation 'org.testfx:testfx-core:4.0.16-alpha'
  testImplementation 'org.testfx:testfx-junit5:4.0.16-alpha'
  testImplementation 'org.mockito:mockito-core:3.11.2'
  testImplementation 'org.mockito:mockito-inline:3.11.2'
}

test {
useJUnitPlatform()}

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}

jacoco {
  toolVersion = "0.8.8" // Use the latest stable version or adjust accordingly
}

test {
  useJUnitPlatform() // Ensures compatibility with JUnit 5
  finalizedBy jacocoTestReport // Ensures the test report is generated after tests
}

jacocoTestReport {
  dependsOn test // Tests need to run before generating the report
  reports {
    xml.required = true // Enable XML report for CI
    html.required = true // Enable HTML report for local viewing
  }
}

tasks.test {
  finalizedBy jacocoTestReport // Automatically run JaCoCo after tests
}